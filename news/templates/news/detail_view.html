{% extends 'main/layout.html' %}

{% block title %}{{ article.title }}{% endblock %}

{% block content %}
    <div class="features">
        <h1>{{ article.title }}</h1>
        <p>{{ article.date }}</p>
        <p>{{ article.full_text }}</p>
        <a href="{% url 'news_delete' article.id %}" class="btn-action btn-delete">Удалить</a>
        <a href="{% url 'news_update' article.id %}" class="btn-action btn-edit">Изменить</a><br>
        <a href="{% url 'news_home' %}" class="btn-action btn-back">Назад</a>
    </div>
{% endblock %}
